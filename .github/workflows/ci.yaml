name: CI Checks

run-name: CI Checks for ${{ github.head_ref }}

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'

      - name: Setup PNPM
        uses: pnpm/setup@v3
        with:
          version: '12.9.0'
          runtime: node@26

      - name: Install Semgrep
        run: pipx install semgrep

      - name: Validade Dependencies
        run: pnpm audit --audit-level critical --ignore-registry-errors

      - name: Validate Code
        run: |
          semgrep scan \
            --config auto \
            --severity ERROR \
            --error \
            --metrics=off \
            src
